question: |
  RIDurableMinor-with-fields
subquestion: |
  ### Before you get started
  - Gather the necessary information about your child and the designated caregiver.
  - Make sure both parents are in agreement with the appointment.

  ### When you are finished
  - Sign the document in front of a notary public to make it legally binding.
  - Provide a copy to the designated caregiver and keep one for your records.

  You can use this form if you are a parent or legal guardian and want to designate someone to make healthcare decisions for your minor child. It is important to ensure that the designated person is trustworthy and understands your wishes regarding medical care.
