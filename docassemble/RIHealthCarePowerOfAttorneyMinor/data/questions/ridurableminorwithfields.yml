metadata:
  title: >-
    Rhode Island: Durable Power of Attorney for Minor
  short title: >-
    RI Power of Attorney (Minor)
  description: |-
    This form allows parents to appoint a caregiver to make healthcare decisions for their child in case they are unable to do so. It ensures that medical treatment can be provided promptly when needed.
  can_I_use_this_form: |
    You can use this form if you are a parent or legal guardian and want to designate someone to make healthcare decisions for your minor child. It is important to ensure that the designated person is trustworthy and understands your wishes regarding medical care.
  before_you_start: |
    ### Before you get started
    - Gather the necessary information about your child and the designated caregiver.
    - Make sure both parents are in agreement with the appointment.

    ### When you are finished
    - Sign the document in front of a notary public to make it legally binding.
    - Provide a copy to the designated caregiver and keep one for your records.
  when_you_are_finished: |
    Once you have signed the document in front of a notary, it is legally effective. Ensure that the designated caregiver has a copy to present in case of a medical emergency. You may also want to inform your child's healthcare provider about this arrangement.
